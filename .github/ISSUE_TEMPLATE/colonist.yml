name: Founding Colonist
description: Opt in to the public Alpha Founding Manifest roster (includes ID card)
title: "MC-#### · Class · Alias"
labels: ["alpha", "founding-colonist"]
body:
  - type: markdown
    attributes:
      value: |
        Shares **alias, MC id, class, title, role family, and ID card** only.
        Do **not** paste résumés, selfies, or private contact info.
  - type: input
    id: alias
    attributes:
      label: Alias / preferred name
    validations:
      required: true
  - type: input
    id: mc
    attributes:
      label: Founding Colonist id
      placeholder: "MC-0417"
    validations:
      required: true
  - type: input
    id: class
    attributes:
      label: Martian class
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Occupation title
    validations:
      required: true
  - type: input
    id: family
    attributes:
      label: Role family (public taxonomy)
    validations:
      required: true
  - type: input
    id: card_path
    attributes:
      label: ID card path in repo
      description: e.g. cards/MC-0417-archive-id-card.png — required. Attach the PNG on this issue if the file is not in cards/ yet.
      placeholder: "cards/MC-####-classname-id-card.png"
    validations:
      required: true
  - type: textarea
    id: card_preview
    attributes:
      label: ID card preview (markdown)
      description: Paste a markdown image linking your card in cards/ or an attached image.
      placeholder: "![ID](https://raw.githubusercontent.com/gavinmcnicol/occupationmars-founding-manifest/main/cards/MC-####-classname-id-card.png)"
    validations:
      required: false
  - type: input
    id: x_handle
    attributes:
      label: Public X handle (optional)
      placeholder: "@you"
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: I opt in to list these fields and my Founding Colonist ID card on this public roster.
          required: true
